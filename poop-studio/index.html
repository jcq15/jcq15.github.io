<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>盘便研究所</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3e9;color:#352e24;font-family:"DM Sans","Microsoft YaHei",sans-serif}main{max-width:780px;margin:auto;padding:clamp(18px,4vw,36px)}header,footer,nav{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font:900 clamp(30px,6vw,50px)/1.15 serif;margin:0;letter-spacing:-.06em}p{font-size:14px;color:#675f50;margin:12px 0 22px}canvas{display:block;width:100%;aspect-ratio:1.35;border:1px solid #bcb5a4;border-radius:18px;background:#e6e1d3;touch-action:none;cursor:crosshair}footer{flex-wrap:wrap;margin-top:15px}button{font:inherit;font-size:14px;color:inherit;background:transparent;border:1px solid #c9c1af;border-radius:22px;padding:8px 16px;cursor:pointer}button[aria-pressed=true]{background:#484e34;color:white;border-color:#484e34}nav{gap:6px}button:focus-visible{outline:3px solid #788148}
.stage{position:relative}.hand{position:absolute;pointer-events:none;font:clamp(32px,6vw,54px)/1 "Segoe UI Emoji",sans-serif;transform:translate(-42%,-4%) rotate(-18deg);transform-origin:42% 4%}.stage canvas{cursor:none}.controls{display:flex;gap:14px 24px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid #ccc3af;font-size:14px}.controls label{display:inline-flex;align-items:center;gap:6px}input{accent-color:#565f3d}input[type=color]{width:36px;height:27px}
</style><main><header><h1>盘便研究所</h1><button id="reset">↻ 再来一坨</button></header><p>按住拖动，推开、摊薄，或者把它拢回来。</p><div class="stage"><canvas aria-label="可用手指或鼠标推抹的软便"></canvas><span class="hand" hidden aria-hidden="true">👆🏻</span></div><footer><span>指腹大小</span><nav><button data-r="9" aria-pressed="false">细</button><button data-r="15" aria-pressed="true">中</button><button data-r="23" aria-pressed="false">粗</button></nav></footer><section class="controls"><label>颜色 <input id="color" type="color" value="#5e391f"></label><label>硬度 <input id="firm" type="range" min="0" max="100" value="35"><output id="level">35%</output></label><label><input type="checkbox" value="seed" class="mix">西瓜子</label><label><input type="checkbox" value="corn" class="mix">玉米粒</label><label><input type="checkbox" value="pepper" class="mix">辣椒皮</label></section></main>
<script>
const canvas=document.querySelector('canvas'), W=960,H=712,N=W*H;
canvas.width=W;canvas.height=H;
const ctx=canvas.getContext('2d'),frame=ctx.createImageData(W,H);
const height=new Float32Array(N), pigment=new Float32Array(N);
let radius=30, previous=null, active=null, queued=false,seed=1;
let base=[94,57,31], firmness=.35;
const pieces=[];
const styles={seed:[2.4,5.5,'#332820'],corn:[5.4,4.3,'#eeb83e'],pepper:[2,5,'#a13c24']};
function scatter(kind){
 for(let n=0;n<3500 && pieces.filter(p=>p.kind===kind).length<22;n++){
  const x=Math.floor(Math.random()*W), y=Math.floor(Math.random()*H);
  if(height[y*W+x]>4)pieces.push({x,y,kind,angle:Math.random()*Math.PI});
 }
}
document.querySelector('#color').oninput=e=>{
 base=[1,3,5].map(i=>parseInt(e.target.value.slice(i,i+2),16));redraw();
};
document.querySelector('#firm').oninput=e=>{
 firmness=e.target.value/100;document.querySelector('#level').value=e.target.value+'%';
};
for(const box of document.querySelectorAll('.mix'))box.onchange=()=>{
 if(box.checked)scatter(box.value);
 else for(let i=pieces.length-1;i>=0;i--)if(pieces[i].kind===box.value)pieces.splice(i,1);
 redraw();
};
function noise(x,y){let k=Math.imul(x+seed,1597334677)^Math.imul(y,381201581);k=Math.imul(k^(k>>>16),2246822519);return ((k^(k>>>13))>>>0)/4294967296}
function reset(){
 seed=Math.floor(Math.random()*100000);height.fill(0);pigment.fill(0);
 // Lay a tapering rope in overlapping coils, rising towards the tip.
 const phase=noise(0,0)*.6;
 for(let s=0;s<=720;s++){
  const t=s/720,a=t*13.7+phase,r=156*Math.pow(1-t,.85), tip=Math.max(0,(t-.87)/.13);
  const cx=W*.5+r*Math.cos(a)-tip*tip*18,cy=H*.55+r*.49*Math.sin(a)-76*t-28*tip;
  const width=(40+6*Math.sin(t*10))*(1-.92*tip), top=30+24*t;
  for(let y=Math.floor(cy-width);y<=cy+width;y++)for(let x=Math.floor(cx-width);x<=cx+width;x++){
   const d=((x-cx)**2+(y-cy)**2)/width**2;if(d>=1)continue;
   const i=y*W+x,h=top*Math.sqrt(1-d)*(1-.85*tip);
   if(h>height[i]){height[i]=h;pigment[i]=h*(.48+.14*Math.sin(x*.19+y*.13)+.14*Math.sin(y*.33-t*8)+.24*noise(x,y))}
  }
 }
 pieces.length=0;for(const box of document.querySelectorAll('.mix:checked'))scatter(box.value);draw();
}
function draw(){
 queued=false;const pixels=frame.data;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x,h=height[i],edge=Math.min(x%80,79-x%80,y%80,79-y%80);
  const shadow=height[Math.max(0,y-5)*W+Math.max(0,x-4)],grain=noise(x,y);
  const bg=(edge===0?-9:edge===1?2:0)+grain*3-Math.min(22,shadow*2);
  if(h===0){const c=i*4;pixels[c]=229+bg;pixels[c+1]=226+bg;pixels[c+2]=213+bg;pixels[c+3]=255;continue}
  const opacity=1-Math.exp(-h*.87);
  const dx=(height[i+1]||0)-(height[i-1]||0),dy=(height[i+W]||0)-(height[i-W]||0);
  const norm=Math.hypot(dx,dy,2),light=(.53*dx+.65*dy+1.08)/norm;
  const tint=h>0?pigment[i]/h:0;
  const shade=21*light+13*tint+25*Math.pow(Math.max(0,light),12);
  const c=i*4;
  pixels[c]=(229+bg)*(1-opacity)+(base[0]+shade)*opacity;
  pixels[c+1]=(226+bg)*(1-opacity)+(base[1]+shade*.78)*opacity;
  pixels[c+2]=(213+bg)*(1-opacity)+(base[2]+shade*.57)*opacity;pixels[c+3]=255;
 }
 ctx.putImageData(frame,0,0);
 for(const p of pieces){
  const [rx,ry,color]=styles[p.kind];
  ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,p.angle,0,2*Math.PI);
  ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#654329';ctx.lineWidth=.9;ctx.stroke();
 }
}
function redraw(){if(!queued){queued=true;requestAnimationFrame(draw)}}
function stroke(a,b){
 const vx=b.x-a.x,vy=b.y-a.y,len=Math.hypot(vx,vy);
 if(len<.01)return;
 const steps=Math.ceil(len/5),ux=vx/len,uy=vy/len;
 for(let step=1;step<=steps;step++){
  const cx=a.x+vx*step/steps,cy=a.y+vy*step/steps;
  for(const p of pieces){
   const d=Math.hypot(p.x-cx,p.y-cy)/radius;
   if(d<1){const push=len/steps*(1-d)*(1-.85*firmness);p.x=Math.max(0,Math.min(W-1,p.x+ux*push));p.y=Math.max(0,Math.min(H-1,p.y+uy*push));}
  }
  // Visit downstream cells first so transferred mass only moves once per step.
  const left=Math.max(0,Math.floor(cx-radius)),right=Math.min(W-1,Math.ceil(cx+radius));
  const upper=Math.max(0,Math.floor(cy-radius)),lower=Math.min(H-1,Math.ceil(cy+radius));
  for(let row=upper;row<=lower;row++)for(let col=left;col<=right;col++){
   const x=ux>=0?right-(col-left):col,y=uy>=0?lower-(row-upper):row,i=y*W+x;
   if(height[i]<.012)continue;
   const rx=(x-cx)/radius,ry=(y-cy)/radius,d=rx*rx+ry*ry;if(d>=1)continue;
   const side=-uy*rx+ux*ry;
   const tx=Math.max(0,Math.min(W-1,Math.round(x+6*(ux-uy*side*.8))));
   const ty=Math.max(0,Math.min(H-1,Math.round(y+6*(uy+ux*side*.8))));
   const j=ty*W+tx,f=Math.min(.82,len/steps*.165*(1.45-firmness*1.35))*(1-d)**1.4;
   const mass=height[i]*f, color=pigment[i]*f;height[i]-=mass;height[j]+=mass;pigment[i]-=color;pigment[j]+=color;
  }
 }
 redraw();
}
function point(e){const rect=canvas.getBoundingClientRect();return {x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height}}
const hand=document.querySelector('.hand');
function showHand(e){
 const p=point(e); hand.hidden=false;hand.style.left=(100*p.x/W)+'%';hand.style.top=(100*p.y/H)+'%';
}
canvas.onpointerleave=()=>{hand.hidden=true};
canvas.onpointerdown=e=>{if(active!==null||e.button!==0)return;showHand(e);active=e.pointerId;canvas.setPointerCapture(active);previous=point(e)};
canvas.onpointermove=e=>{if(active===null||active===e.pointerId)showHand(e);if(e.pointerId!==active)return;const p=point(e);stroke(previous,p);previous=p};
canvas.onlostpointercapture=()=>{active=null;previous=null;hand.hidden=true};
document.querySelector('#reset').onclick=reset;
for(const button of document.querySelectorAll('[data-r]'))button.onclick=()=>{radius=2*Number(button.dataset.r);for(const other of document.querySelectorAll('[data-r]'))other.setAttribute('aria-pressed',String(other===button))};
reset();
</script></html>
